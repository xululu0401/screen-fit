  <text x="600" y="657" text-anchor="middle" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="72" font-weight="700" fill="#2c6a48">✓ 92 寸</text>
  <text x="600" y="438" text-anchor="middle" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="38" font-weight="700" fill="#b13a2b">✗ 120 寸：坐 3 米视角 47.8°，太近</text>
  <text x="140" y="970" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" fill="#4c505a">92 寸：视角 37.5° · 205 nit · 投影机放 2600–3055 mm</text>
