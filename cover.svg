  <line x1="120" y1="890" x2="1080" y2="890" stroke="#9a958a" stroke-width="4"/>
  <rect x="388.8" y="527.9" width="422.4" height="237.6" fill="rgba(44,106,72,.12)" stroke="#2c6a48" stroke-width="6"/>
